name: Backend

# Отдельно от ci.yml намеренно: тот воркфлоу целиком про фронтенд (npm, vitest,
# сборка Vite), и добавлять в него Python с PostgreSQL значит заставлять каждую
# правку кнопки поднимать базу. Здесь — только server/.
#
# До этого файла бэкенд не проверялся на CI ни разу: тесты гонялись только
# локально, и любой регресс на сервере доезжал до ветки незамеченным.

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

jobs:
  qa:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        # 16 — та же основная версия, что и в разработке, и та, под которую
        # написаны миграции. Расхождение версий на CI прячет ошибки схемы до
        # деплоя, а не ловит их.
        image: postgres:16
        env:
          # Пароля здесь нет и не должно быть: контейнер живет внутри задания,
          # снаружи недоступен и умирает вместе с ним. Строка подключения ниже
          # по этой же причине не секрет — секретов в репозитории не держим.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Без проверки готовности шаг с тестами стартует раньше базы и падает
        # на подключении, а выглядит это как сломанный тест.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тестовая база пересоздается самим прогоном (tests/conftest.py), поэтому
      # достаточно адреса сервера и имени, которое можно дропать.
      VOKAL_TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/vokal_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Нижняя граница из pyproject (requires-python >=3.11,<3.13) и та же
          # версия, на которой прогон идет локально.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install dependencies
        # Точные версии не зафиксированы: лок-файла в проекте нет, хотя
        # комментарий в pyproject.toml обещает uv.lock. Пока его не будет,
        # установка здесь воспроизводима только по нижним границам версий.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Tests
        run: pytest tests -q
