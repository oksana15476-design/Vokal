server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Прототип не индексируется: запрет действует при любом правовом ответе,
    # см. docs/LEGAL_POSITION.md. Дублируем заголовком, потому что meta-тег
    # виден только после загрузки документа.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Ассеты собираются с хешем в имени, поэтому кешируются надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Документ не кешируем: иначе после выкладки часть зрителей останется
    # на старой версии, а стенд показывают на интервью.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
