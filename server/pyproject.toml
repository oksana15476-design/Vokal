[project]
name = "vokal-server"
version = "0.1.0"
description = "Бэкенд Vokal Director: каркас HTTP-слоя"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Ядро каркаса. Версии закреплены по нижней границе, а не намертво:
# лок-файл (uv.lock) фиксирует точные версии, pyproject задает совместимость.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Клиент S3-совместимых хранилищ (Yandex Object Storage, VK Cloud,
    # Selectel). В основных зависимостях, а не в extras, намеренно: реализация
    # хранилища выбирается одной переменной окружения VOKAL_STORAGE_BACKEND, и
    # если переключение на s3 дополнительно требует переустановить пакеты, то
    # «одна переменная» перестает быть правдой ровно в тот момент, когда это
    # важнее всего, — на боевом сервере.
    "boto3>=1.34",
    # Чтение заголовков аудио: длительность, частота дискретизации, каналы для
    # MP3, FLAC и M4A. Чистый Python без системных библиотек — важно, потому
    # что сборка образа не должна тянуть ffmpeg ради трех чисел. Выборки
    # mutagen не декодирует, поэтому пик (клиппинг) считается только для
    # несжатого WAV средствами стандартной библиотеки (app/services/uploads.py).
    "mutagen>=1.47",
]

[project.optional-dependencies]
# Именно extras, а не [dependency-groups]: extras понимают и uv, и обычный pip,
# а задача разрешает оба способа установки.
dev = [
    "pytest>=8.2",
    # Без него `tests/conftest.py` не импортируется вовсе: он уже пользуется
    # `pytest_asyncio.fixture`, а в списке зависимостей пакета не было. Чистая
    # установка `pip install -e '.[dev]'` до этой строки давала не падающие
    # тесты, а несобираемый прогон.
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
# Точки входа вместо Makefile: Makefile не входит в зону этого батча,
# а pyproject входит. После установки пакета доступны как команды в venv.
vokal-dev = "app.core.scripts:dev"
vokal-test = "app.core.scripts:test"
vokal-lint = "app.core.scripts:lint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Пакет `app` собран без __init__.py (пространство имен), и editable-установка
# без этой строки не кладет корень server/ в sys.path — команды vokal-* тогда
# ставятся, но падают на импорте.
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет app импортируется из корня server/ и без установки колеса,
# чтобы прогон тестов не зависел от того, ставили ли проект в editable-режиме.
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
