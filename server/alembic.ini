; Конфигурация Alembic для Vokal Director.
;
; sqlalchemy.url здесь намеренно пустой. Строка подключения приходит из
; окружения (VOKAL_DATABASE_URL) или подставляется вызывающим кодом.
; Держать ее в файле репозитория нельзя: там логин, хост и пароль, а история
; git необратима.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
